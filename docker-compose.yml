services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
      POSTGRES_DB: conference_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference -d conference_db"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://conference:conference@db:5432/conference_db
      SECRET_KEY: change-this-in-production
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
