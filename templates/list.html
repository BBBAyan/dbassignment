{% extends 'base.html' %}{% block content %}<h2>{{kind|title}}</h2><p><a class="button" href="/{{kind}}/new">+ Create {{kind[:-1]}}</a></p><table><tr><th>ID</th><th>Record</th><th>Actions</th></tr>{% for row in rows %}<tr><td>{{row.id}}</td><td>{{row.summary}}</td><td><a href="/{{kind}}/{{row.id}}/edit">Read / edit</a> &nbsp; <form class="inline" action="/{{kind}}/{{row.id}}/delete" method="post" onsubmit="return confirm('Delete this record?')"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
