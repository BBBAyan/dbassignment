<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conference Review Admin</title><style>
body{background:#f6f8fb;font:15px/1.5 system-ui,Arial;color:#1e293b;margin:0}header{background:#172a46;color:white;padding:20px 5%}header a{color:#dae8ff;margin-right:22px}main{max-width:1100px;margin:28px auto;padding:0 20px}.panel{background:white;padding:23px;border:1px solid #e3e8ee;border-radius:12px;box-shadow:0 2px 10px #182d4412}a{color:#1653a3}button,.button{background:#1653a3;color:white;border:0;padding:8px 13px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}button.danger{background:#af2d3f}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf2}label{display:block;margin:13px 0 5px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #bfc9d6;padding:9px;border-radius:5px;font:inherit}input[type=checkbox]{width:auto}textarea{min-height:90px}code,pre{white-space:pre-wrap}.notice{padding:12px;margin-bottom:15px;background:#ecf9ed;border-radius:6px}.error{background:#ffe9e9}form.inline{display:inline}.small{font-size:12px;color:#56667a}
</style></head><body><header><h1>Research Conference Management</h1><nav><a href="{{ url_for('home') }}">Dashboard</a><a href="/users">Users</a><a href="/papers">Papers</a><a href="/reviews">Reviews</a><a href="/sessions">Sessions</a><a href="/schedule">Accepted Schedule</a></nav></header><main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{category}}">{{message}}</div>{% endfor %}{% endwith %}<div class="panel">{% block content %}{% endblock %}</div></main></body></html>
